name: SysCentre Continuity Fallback

on:
  push:
    branches: [main]
    paths:
      - "bonus-app/**"
      - ".github/workflows/bonus-app-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: syscentre-continuity-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare standalone fallback
        run: |
          mkdir -p _site
          cp bonus-app/index.html _site/index.html

      - name: Upload fallback artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy fallback
        id: deployment
        uses: actions/deploy-pages@v4

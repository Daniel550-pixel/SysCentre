# Deploy the standalone SysCentre continuity app and its source catalog
name: Deploy SysCentre Systems Fabric

on:
  push:
    branches: ["main"]
    paths:
      - "bonus-app/**"
      - "runtime/repository_catalog.json"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify and stage fallback app and catalog
        run: |
          test -s bonus-app/index.html
          python - <<'PY'
          import json, re
          from pathlib import Path
          catalog = json.loads(Path("runtime/repository_catalog.json").read_text(encoding="utf-8"))
          repos = catalog["repositories"]
          assert len(repos) == 28, f"Expected 28 repositories, found {len(repos)}"
          assert len({repo["id"] for repo in repos}) == len(repos), "Duplicate repository IDs"
          assert len({repo["name"] for repo in repos}) == len(repos), "Duplicate repository names"
          required = {"id", "name", "url", "category", "purpose", "capabilities"}
          for repo in repos:
              missing = required - repo.keys()
              assert not missing, f"{repo.get('name', '<unnamed>')} missing {sorted(missing)}"
              assert repo["url"].startswith("https://github.com/"), f"Invalid repository URL: {repo['name']}"
              assert isinstance(repo["capabilities"], list), f"Capabilities must be a list: {repo['name']}"
          html = Path("bonus-app/index.html").read_text(encoding="utf-8")
          map_groups = re.findall(r'categories:\[([^\]]+)\]', html)
          mapped_categories = set(re.findall(r'"([^"]+)"', " ".join(map_groups)))
          catalog_categories = {repo["category"] for repo in repos}
          missing_categories = catalog_categories - mapped_categories
          assert not missing_categories, f"Unmapped capability-map categories: {sorted(missing_categories)}"
          print(f"Validated {len(repos)} unique repositories across {len(catalog_categories)} mapped categories")
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("bonus-app/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "No application script found"
          Path("/tmp/syscentre-app.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/syscentre-app.js
          mkdir -p _site
          cp bonus-app/index.html _site/index.html
          cp runtime/repository_catalog.json _site/systems.json
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/systems.json

      - name: Upload fallback site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy fallback
        id: deployment
        uses: actions/deploy-pages@v5

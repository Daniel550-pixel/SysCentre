# Deploy the standalone SysCentre continuity fallback to GitHub Pages
name: Deploy SysCentre Continuity Fallback

on:
  push:
    branches: ["main"]
    paths:
      - "bonus-app/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify and stage fallback app
        run: |
          test -s bonus-app/index.html
          mkdir -p _site
          cp bonus-app/index.html _site/index.html
          touch _site/.nojekyll

      - name: Upload fallback site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy fallback
        id: deployment
        uses: actions/deploy-pages@v5

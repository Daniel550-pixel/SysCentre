# Deploy the standalone SysCentre continuity app and its source catalog
name: Deploy SysCentre Systems Fabric

on:
  push:
    branches: ["main"]
    paths:
      - "bonus-app/**"
      - "runtime/repository_catalog.json"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Verify and stage fallback app and catalog
        run: |
          test -s bonus-app/index.html
          python -c "import json; d=json.load(open('runtime/repository_catalog.json', encoding='utf-8')); assert len(d['repositories']) == 28"
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("bonus-app/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "No application script found"
          Path("/tmp/syscentre-app.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/syscentre-app.js
          mkdir -p _site
          cp bonus-app/index.html _site/index.html
          cp runtime/repository_catalog.json _site/systems.json
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/systems.json

      - name: Upload fallback site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy fallback
        id: deployment
        uses: actions/deploy-pages@v5

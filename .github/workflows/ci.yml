name: SysCentre CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test runtime policy and status
        run: python -m unittest discover -s runtime -p "test_*.py" -v

  webapp-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webapp/package.json
      - name: Install dependencies
        run: npm --prefix webapp install
      - name: Type-check and build webapp
        run: npm --prefix webapp run build

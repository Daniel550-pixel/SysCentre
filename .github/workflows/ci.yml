name: SysCentre CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test runtime policy and status
        run: python -m unittest discover -s runtime -p "test_*.py" -v

  webapp-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm --prefix webapp ci
      - name: Type-check and build webapp
        run: npm --prefix webapp run build

  powershell-script-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell scripts without executing them
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Path scripts -Filter "*.ps1" -File
          if (-not $files) { throw "No PowerShell scripts found." }
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$($file.Name): $($_.Message) at line $($_.Extent.StartLineNumber)" }
              throw "PowerShell parser validation failed for $($file.Name)."
            }
            Write-Host "PASS $($file.Name)"
          }
